manifest_version = 1

[package]
id = "org.dreamweave.merge-to-master"
version = "0.1.0"
jess_api = "1"
include = ["src"]
tests = ["tests/run.luau", "tests/merge.luau", "tests/commands.luau", "tests/style.luau"]

[dependencies]
"org.dreamweave.tes3" = "0.1"
"org.dreamweave.tes3conv" = "0.1"

[modules]
"@merge-to-master" = "src/init.luau"
"@merge-to-master/commands" = "src/commands.luau"

# Every module here is inert API: it does nothing until something requires it, and runs with the
# authority of whatever calls it. `@merge-to-master` never touches the filesystem: callers hand it
# record lists and get a record list back. `@merge-to-master/commands` reads the plugin and its
# masters and writes the merged master, so its caller needs to read and write files.

[[layer]]
id = "merge-to-master.core"
requires = ["tes3.core", "tes3conv.core"]
exports = ["@merge-to-master", "@merge-to-master/commands"]
