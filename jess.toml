manifest_version = 1

[package]
id = "org.dreamweave.merge-to-master"
version = "0.1.0"
jess_api = "1"
include = ["src"]
tests = ["tests/run.luau", "tests/merge.luau", "tests/style.luau"]

[dependencies]
"org.dreamweave.tes3conv" = "0.1"

[modules]
"@merge-to-master" = "src/init.luau"

# The module is inert API: it does nothing until something requires it, and it never touches the
# filesystem. Callers hand it record lists and get a record list back.

[[layer]]
id = "merge-to-master.core"
requires = ["tes3conv.core"]
exports = ["@merge-to-master"]
