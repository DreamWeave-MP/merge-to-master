# merge-to-master as a DreamWeave project: a Jess package. `jess` names the Package Source it
# publishes, the jess.toml at the repository root, and each release tag `merge_to_master-<version>` is one
# version of the package, packed by the Mod Template from that tag; every push packs a
# development build.
id = "25a14f79-a94a-495c-80d6-d1e834c924c2"
slug = "merge_to_master"
type = "tool"
status = "active"

[[maintainers]]
name = "DreamWeave"
url = "https://github.com/DreamWeave-MP"

[package]
format = "jpk"
jess = "org.dreamweave.merge-to-master"

[[releases]]
version = "0.1.0"
date = 2026-10-21
summary = "First release published as a DreamWeave project."
